<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="shard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3F5FD0"/>
      <stop offset="55%" stop-color="#0D7D72"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E3E6F6"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Crystal shard outline (line art, no fill) -->
  <g>
    <polygon points="256,72 336,168 306,352 256,432 206,352 176,168"
             fill="none" stroke="url(#shard)" stroke-width="8.5" stroke-linejoin="round"/>
    <polyline points="176,168 256,196 336,168" fill="none" stroke="url(#shard)" stroke-width="3.8" opacity="0.9"/>
    <polyline points="206,352 256,320 306,352" fill="none" stroke="url(#shard)" stroke-width="3.8" opacity="0.9"/>
    <line x1="256" y1="196" x2="256" y2="320" stroke="url(#shard)" stroke-width="3.8" opacity="0.7"/>
  </g>

  <!-- Three-hop topology through the core: browser (top) / gateway (diamond) / server (bottom) -->
  <line x1="256" y1="30" x2="256" y2="196" stroke="#4A4E72" stroke-width="5" stroke-dasharray="3 11" stroke-linecap="round"/>
  <circle cx="256" cy="30" r="15" fill="#4A4E72"/>
  <rect x="244" y="246" width="24" height="24" rx="5" fill="#0D0E18" transform="rotate(45 256 258)"/>
  <line x1="256" y1="320" x2="256" y2="462" stroke="#0D6B63" stroke-width="7" stroke-linecap="round"/>
  <circle cx="256" cy="462" r="26" stroke="#0D6B63" stroke-width="3.5" fill="none" opacity="0.55"/>
  <circle cx="256" cy="462" r="16" fill="#0D6B63"/>
</svg>
