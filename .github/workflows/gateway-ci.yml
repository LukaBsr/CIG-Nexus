name: Gateway CI

on:
  push:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-ci.yml"
  pull_request:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 24: matches gateway/Dockerfile's node:24-alpine base image. Node 18
      # reached end-of-life in April 2025; the gateway is the one service
      # that directly faces browser-supplied input.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          cd gateway
          npm ci

      - name: Build
        run: |
          cd gateway
          npm run build

      - name: Test
        run: |
          cd gateway
          npm test
